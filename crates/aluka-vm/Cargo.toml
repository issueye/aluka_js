[package]
name = "aluka-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tier 0 字节码虚拟机：帧、操作数栈、内联缓存、异常与调用。"

[dependencies]
aluka-core = { workspace = true }
aluka-bytecode = { workspace = true }
aluka-module = { workspace = true }
aluka-jit = { workspace = true }
aluka-regex = { workspace = true }
# zlib 内置库压缩后端（全部纯 Rust，无 C 依赖）：
# flate2 默认 rust backend = miniz_oxide；brotli / ruzstd 均为纯 Rust 实现。
flate2 = "1"
brotli = "7"
ruzstd = "0.8"
# node:sqlite 唯一获准的 C 依赖（AGENTS.md FFI 边界例外）：bundled 把
# SQLite C amalgamation 静态编进二进制，保持单文件零运行时依赖。
rusqlite = { version = "0.37", features = ["bundled", "column_decltype", "column_metadata"] }
base64 = "0.22"
# cluster 端口共享（M5.2）：SO_REUSEADDR/REUSEPORT 纯 Rust 绑定
socket2 = "0.5"
# TLS spike（T10 评估）：rustls + rustls-rustcrypto 纯 Rust 加密后端
# （无 ring/C/asm；评估能否满足 AGENTS 纯 Rust 约束下的真实 TLS 握手）
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "custom-provider"] }
rustls-rustcrypto = "0.0.2-alpha"
# DNS 递归查询（M3.4b A+ 路线）：hickory-proto 仅做 DNS 报文编解码
# （纯 Rust、关默认特性——不带 tokio/hickory-resolver runtime 链）；
# resolve* 家族经 std::thread 工作线程 + crossbeam-channel 与
# VM 同步事件泵桥接（M5.1 worker_threads 将复用同款 channel 基建）。
hickory-proto = { version = "0.25", default-features = false, features = ["std"] }
crossbeam-channel = "0.5.17"

[lints]
workspace = true
