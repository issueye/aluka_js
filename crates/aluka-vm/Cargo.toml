[package]
name = "aluka-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tier 0 字节码虚拟机：帧、操作数栈、内联缓存、异常与调用。"

[dependencies]
aluka-core = { workspace = true }
aluka-bytecode = { workspace = true }
aluka-jit = { workspace = true }
aluka-regex = { workspace = true }
# zlib 内置库压缩后端（全部纯 Rust，无 C 依赖）：
# flate2 默认 rust backend = miniz_oxide；brotli / ruzstd 均为纯 Rust 实现。
flate2 = "1"
brotli = "7"
ruzstd = "0.8"
# node:sqlite 唯一获准的 C 依赖（AGENTS.md FFI 边界例外）：bundled 把
# SQLite C amalgamation 静态编进二进制，保持单文件零运行时依赖。
rusqlite = { version = "0.37", features = ["bundled"] }
base64 = "0.22"
# TLS spike（T10 评估）：rustls + rustls-rustcrypto 纯 Rust 加密后端
# （无 ring/C/asm；评估能否满足 AGENTS 纯 Rust 约束下的真实 TLS 握手）
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "custom-provider"] }
rustls-rustcrypto = "0.0.2-alpha"

[lints]
workspace = true
